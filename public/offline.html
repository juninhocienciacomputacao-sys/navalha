<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0a0a">
<title>Sem internet · Navalha</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fafafa; color: #171717; text-align: center; padding: 24px; box-sizing: border-box; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } p { color: #a3a3a3 !important; } }
  h1 { font-size: 22px; margin: 12px 0 6px; }
  p { color: #525252; margin: 4px 0; line-height: 1.5; }
  button { margin-top: 18px; padding: 12px 22px; border-radius: 12px; border: 0; background: #f59e0b; color: #0a0a0a; font-weight: 700; font-size: 15px; }
</style>
</head>
<body>
<main>
  <div style="font-size:44px">✂️</div>
  <h1>Sem internet</h1>
  <p>Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
  <p lang="en">No internet connection. · <span lang="es">Sin conexión a internet.</span></p>
  <button onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
